[package]
name = "rypora"
version = "0.4.3"
description = "A lightweight local Markdown workspace"
authors = ["Rypora Dev"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rypora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
notify = "8"
notify-debouncer-full = "0.6"
trash = "5"
nucleo-matcher = "0.3"
thiserror = "2"
tempfile = "3"
parking_lot = "0.12"
tantivy = "0.22"
jieba-rs = "0.11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
