name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx vitest run
      - run: npm run check

  build:
    name: ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            bundles: deb,rpm,appimage
            target: ""
          - name: windows-x86_64
            os: windows-latest
            bundles: nsis,msi
            target: ""
          - name: macos-arm64
            os: macos-latest
            bundles: dmg
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            bundles: dmg
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS cross target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - run: npm ci

      - name: Build bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rypora-${{ matrix.name }}
          path: ${{ matrix.target != '' && format('src-tauri/target/{0}/release/bundle', matrix.target) || 'src-tauri/target/release/bundle' }}
          if-no-files-found: error

  arch-x86_64:
    name: arch-x86_64
    needs: test
    runs-on: ubuntu-24.04
    container: archlinux:latest

    steps:
      - name: Install base tooling
        run: pacman -Syu --noconfirm --needed base-devel git nodejs npm

      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          pacman -S --noconfirm --needed \
            rust \
            webkit2gtk-4.1 \
            gtk3 \
            libsoup3 \
            openssl \
            pkgconf \
            libarchive

      - run: npm ci
      - run: npm run build
      - run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Build Arch package
        run: |
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          bash packaging/arch/build-pkg.sh "$VERSION" \
            src-tauri/target/release/rypora packaging/arch/out

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rypora-arch-x86_64
          path: packaging/arch/out/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, arch-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Make AppImage executable
        run: chmod +x artifacts/appimage/*.AppImage || true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.pkg.tar.zst
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
